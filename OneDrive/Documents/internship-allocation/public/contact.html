<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Command - InternHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080312; color: #fff; }
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="bg-[#080312] min-h-screen">
    <!-- Navbar -->
    <nav class="bg-black/40 backdrop-blur-xl border-b border-white/10 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-satellite-dish text-brand-500 text-xl"></i>
                <span class="font-display font-bold text-2xl">InternHub Comms</span>
            </div>
            <a href="/dashboard.html" class="px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-bold transition-all"><i class="fas fa-arrow-left mr-2"></i>Return to Hub</a>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto p-10 pt-20">
        <div class="glass-card p-12 rounded-[2rem] text-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-brand-500 to-indigo-500 mx-auto rounded-full flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/20">
                <i class="fas fa-paper-plane text-white text-3xl"></i>
            </div>
            <h1 class="text-4xl font-display font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-indigo-400">Establish Comm Link</h1>
            <p class="text-gray-400 mb-8 max-w-lg mx-auto leading-relaxed">Direct queries to our central command structure. We utilize prioritized queuing for all incoming requests.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left mb-8">
                <div class="bg-white/5 border border-white/10 p-6 rounded-2xl">
                    <i class="fas fa-envelope text-brand-400 mb-3 text-xl"></i>
                    <h3 class="font-bold text-lg mb-1">Direct Support</h3>
                    <p class="text-sm font-mono text-gray-400">support@internhub.dev</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-6 rounded-2xl">
                    <i class="fas fa-building text-brand-400 mb-3 text-xl"></i>
                    <h3 class="font-bold text-lg mb-1">Enterprise Nodes</h3>
                    <p class="text-sm font-mono text-gray-400">corporate@internhub.dev</p>
                </div>
            </div>
            
            <a href="mailto:support@internhub.dev" class="inline-block px-8 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-white font-bold transition shadow-[0_0_20px_rgba(124,58,237,0.3)]">
                Initialize Transmission
            </a>
        </div>
    </main>
</body>
</html>
